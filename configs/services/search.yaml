# Disaster-recovery declaration for the Search service.
# CI (ci/validate_services.py) checks this file on every push.
name: Search
tier: Important  # Critical | Important | Normal
load_units: 30    # capacity the service needs, in the simulator's units
home_zone: B      # zone where the service normally runs
recovery:
  rto_seconds: 120   # target: back in service within this time after a failure
