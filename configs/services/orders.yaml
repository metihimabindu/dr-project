# Disaster-recovery declaration for the Orders service.
# CI (ci/validate_services.py) checks this file on every push.
name: Orders
tier: Critical   # Critical | Important | Normal
load_units: 25    # capacity the service needs, in the simulator's units
home_zone: B      # zone where the service normally runs
recovery:
  rto_seconds: 60    # target: back in service within this time after a failure
