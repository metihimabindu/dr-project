# Disaster-recovery declaration for the Recommendations service.
# CI (ci/validate_services.py) checks this file on every push.
name: Recommendations
tier: Normal     # Critical | Important | Normal
load_units: 20    # capacity the service needs, in the simulator's units
home_zone: D      # zone where the service normally runs
recovery:
  rto_seconds: 300   # target: back in service within this time after a failure
