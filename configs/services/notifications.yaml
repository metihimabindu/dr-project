# Disaster-recovery declaration for the Notifications service.
# CI (ci/validate_services.py) checks this file on every push.
name: Notifications
tier: Important  # Critical | Important | Normal
load_units: 15    # capacity the service needs, in the simulator's units
home_zone: C      # zone where the service normally runs
recovery:
  rto_seconds: 120   # target: back in service within this time after a failure
