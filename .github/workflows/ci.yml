# Runs on every push and pull request.
# It checks the disaster-recovery declaration of every service and runs simulated failures,
# so a change that breaks recovery is caught before it is merged.
name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install dependencies
        run: pip install -r requirements-ci.txt

      - name: Validate the service declarations (YAML)
        run: python ci/validate_services.py

      - name: Simulated failures (every failure type)
        run: python tests/test_ci.py

      - name: Existing unit tests (baseline and feedback)
        shell: bash
        run: |
          for f in tests/test_baseline.py tests/test_feedback.py; do
            log="$RUNNER_TEMP/$(basename "$f").log"
            python "$f" | tee "$log"
            if grep -q "^FAIL" "$log"; then exit 1; fi
          done